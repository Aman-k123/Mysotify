<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMusic - Web Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- बायां पैनल -->
        <aside class="sidebar">
            <div class="logo">🎵 MyMusic</div>
            <ul>
                <li id="navHome" class="active">🏠 Home</li>
                <li id="navSearch">🔍 Search</li>
                <li id="navLibrary">📚 Your Library</li>
            </ul>
            <div class="playlist-box">
                <p>Your Playlist</p>
                <span>Click + on any song to save it here.</span>
            </div>
        </aside>

        <!-- बीच का मुख्य हिस्सा -->
        <main class="content">
            <div id="searchContainer" class="search-box" style="display: none;">
                <input type="text" id="songSearchInput" placeholder="Search song or artist...">
            </div>

            <h2 id="pageTitle">Trending Songs</h2>
            <div id="songList" class="songs-grid"></div>
        </main>

        <!-- दायां पैनल -->
        <aside class="right-panel">
            <h3>Now Playing</h3>
            <div class="canvas-box">
                <img id="rightCover" src="covers/1.jpg" alt="Cover">
            </div>
            <div class="right-song-info">
                <h4 id="rightSongName">Bairen</h4>
                <p id="rightArtistName">Banjaare</p>
            </div>
        </aside>
    </div>

    <!-- नीचे का म्यूज़िक प्लेयर -->
    <footer class="player-bar">
        <div class="song-info">
            <img id="masterCover" src="https://unsplash.com" alt="Cover">
            <div>
                <h4 id="masterSongName">Bairen</h4>
                <p id="masterArtistName">Banjaare</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="buttons">
                <button id="prevBtn">⏮</button>
                <button id="masterPlay" class="play-btn">▶</button>
                <button id="nextBtn">⏭</button>
            </div>
            <input type="range" id="progressBar" value="0" min="0" max="100">
        </div>

        <div class="volume-control">
            <span>🔊</span>
            <input type="range" id="volumeBar" value="80" min="0" max="100">
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
